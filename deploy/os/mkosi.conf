# Orbit Cloud appliance: a minimal Debian image whose only service is orbitd.
# Build with ./build.sh (it builds orbitd first); see README.md.

[Distribution]
Distribution=debian
Release=trixie

[Output]
Format=disk
ImageId=orbit-cloud
Output=orbit-cloud
OutputDirectory=mkosi.output
# The root file system is mounted read-only; all state lives on the data partition.
ReadOnly=yes

[Content]
Bootable=yes
Bootloader=systemd-boot
Hostname=orbit-cloud
# No root password: nobody can log in on the console. Set RootPassword= in a mkosi.local.conf for a recovery shell.
Autologin=no
WithDocs=no
WithRecommends=no
CleanPackageMetadata=yes
KernelCommandLine=console=ttyS0 console=tty0 quiet
Packages=
        systemd
        systemd-sysv
        systemd-resolved
        udev
        e2fsprogs
RemoveFiles=
        /usr/share/man
        /usr/share/doc
        /usr/share/info
        /usr/share/locale

[Runtime]
RAM=1G
# Forward the host's 127.0.0.1:18080 to orbitd's port 8080 (user-mode networking).
QemuArgs=-nic user,model=virtio-net-pci,hostfwd=tcp:127.0.0.1:18080-:8080
