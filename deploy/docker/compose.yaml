# docker compose -f deploy/docker/compose.yaml up --build
# The admin token and the database password are required:
#   ORBIT_CLOUD_TOKEN=... POSTGRES_PASSWORD=... docker compose -f deploy/docker/compose.yaml up
# Apps whose spec says "postgres": true get their own database and role on the `postgres` service.
name: orbit-cloud

services:
  orbitd:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: orbit-cloud:local
    restart: unless-stopped
    environment:
      ORBIT_CLOUD_TOKEN: ${ORBIT_CLOUD_TOKEN:?set ORBIT_CLOUD_TOKEN to the admin token}
      # The admin connection used to create a database and role per app (docs/postgres.md).
      ORBIT_CLOUD_POSTGRES_URL: postgres://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/postgres
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      # API, console and metrics. Bind to loopback and put a TLS reverse proxy in front for anything but local use.
      - "127.0.0.1:8080:8080"
      # Publish the ports that service apps listen on (their spec's `listen`), for example:
      # - "9000:9000"
    volumes:
      - orbit-data:/var/lib/orbit-cloud
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    # Not published: only orbitd (and the apps it runs) reach it, over the compose network.
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    stop_grace_period: 30s

volumes:
  orbit-data:
  postgres-data:
