# Drop-in for running the platform gateway on ports 80 and 443 as the unprivileged dynamic user.
#   install -D deploy/systemd/orbitd-gateway.conf /etc/systemd/system/orbitd.service.d/gateway.conf
# and put in /etc/orbit-cloud/orbitd.env:
#   ORBIT_CLOUD_BASE_DOMAIN=cloud.example.com
#   ORBIT_CLOUD_ACME_EMAIL=you@example.com
#   ORBIT_CLOUD_LISTEN=127.0.0.1:8080
# DNS: cloud.example.com and *.cloud.example.com point at this host.
#
# Alternative without any capability: `sysctl net.ipv4.ip_unprivileged_port_start=80` and leave the unit as it is.
[Service]
CapabilityBoundingSet=CAP_NET_BIND_SERVICE
AmbientCapabilities=CAP_NET_BIND_SERVICE
# A private user namespace has no say over the host's low ports.
PrivateUsers=no
