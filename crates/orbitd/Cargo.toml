[package]
name = "orbitd"
description = "Orbit Cloud node: runs WebAssembly apps on Orbit with logs, traces, metrics, KV and queues"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
oc-store.workspace = true
orbit-abi.workspace = true
orbit-runtime.workspace = true
orbit-caps.workspace = true
tokio.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
futures-util.workspace = true
tokio-stream.workspace = true
argon2 = "0.6"
hyper = { version = "1", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "client-legacy", "http1", "http2"] }
http-body-util = "0.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
instant-acme = { version = "0.8", default-features = false, features = ["ring", "hyper-rustls", "rcgen"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
hickory-resolver = { version = "0.26", default-features = false, features = ["system-config", "tokio"] }
ipnet = "2"
x509-parser = "0.18"
sha2.workspace = true
rand.workspace = true
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
wat.workspace = true
tempfile.workspace = true

[lints]
workspace = true
